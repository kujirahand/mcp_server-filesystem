[project]
name = "filesystem-mcp"
version = "1.0.2"
description = "An MCP server that can only read and write files inside allowed folders"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "kujirahand", email = "web@kujirahand.com" }]
keywords = ["mcp", "model-context-protocol", "filesystem", "llm", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: Japanese",
]
dependencies = ["mcp>=2.0.0"]

[project.urls]
Homepage = "https://github.com/kujirahand/mcp_server-filesystem"
Repository = "https://github.com/kujirahand/mcp_server-filesystem"
Issues = "https://github.com/kujirahand/mcp_server-filesystem/issues"

[project.scripts]
filesystem-mcp = "filesystem_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/filesystem_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]
